
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textprüfung</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #101116;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(30px, 7vw, 44px);
    }

    .subtitle {
      margin: 0 0 24px;
      color: #a5adc0;
      font-size: 16px;
    }

    .camera-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid #414553;
      border-radius: 16px;
      background: #050506;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin: 20px auto;
      max-width: 520px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    #startButton {
      background: #f5f5f7;
      color: #111216;
    }

    #stopButton {
      background: #30333d;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      display: none;
      margin: 20px auto;
      max-width: 520px;
      padding: 20px 12px;
      border: 1px solid;
      border-radius: 14px;
      font-size: clamp(23px, 6vw, 34px);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    #status.blocked {
      display: block;
      color: #ff4b55;
      border-color: #ff4b55;
      background: #30171b;
    }

    #status.posted {
      display: block;
      color: #39df8a;
      border-color: #39df8a;
      background: #11291f;
    }

    #info {
      min-height: 24px;
      margin: 16px 0;
      color: #a5adc0;
      font-size: 14px;
      line-height: 1.5;
    }

    .note {
      margin: 24px auto 0;
      max-width: 520px;
      color: #a5adc0;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>Textprüfung</h1>
    <p class="subtitle">Automatische Texterkennung</p>

    <div class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
      <button id="startButton">Kamera starten</button>
      <button id="stopButton" disabled>Kamera stoppen</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <p id="info">Starte die Kamera, um Text zu prüfen.</p>

    <p class="note">
      Halte den Text gut beleuchtet und möglichst ruhig vor die Kamera.
      Die Erkennung kann bei unscharfen Bildern oder ungewöhnlicher Schrift
      Fehler machen.
    </p>
  </main>

  <canvas id="canvas" hidden></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const statusBox = document.getElementById("status");
    const info = document.getElementById("info");

    let stream = null;
    let worker = null;
    let running = false;
    let scanning = false;
    let scanTimer = null;
    let statusTimer = null;
    let lastResult = null;

    // Vereinheitlicht Groß-/Kleinschreibung und Sonderzeichen.
    function normalizeText(text) {
      return (text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ß/g, "ss")
        .replace(/[^a-z0-9]/g, "");
    }

    // Berechnet den Abstand zwischen zwei Zeichenfolgen.
    function levenshtein(a, b) {
      const dp = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;

      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;

          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }

      return dp[a.length][b.length];
    }

    // Erkennt das Wort auch innerhalb längerer zusammengesetzter Wörter.
    function containsTarget(text) {
      const normalized = normalizeText(text);

      if (normalized.includes("schlange")) {
        return true;
      }

      // Prüft kurze Textabschnitte auf typische OCR-Fehler.
      // Der Grenzwert ist absichtlich klein, um Fehlalarme zu begrenzen.
      const target = "schlange";

      for (let i = 0; i <= normalized.length - 7; i++) {
        const part = normalized.slice(i, i + 8);

        if (levenshtein(part, target) <= 1) {
          return true;
        }
      }

      return false;
    }

    function clearStatus() {
      clearTimeout(statusTimer);
      statusBox.style.display = "none";
      statusBox.className = "";
      statusBox.textContent = "";
    }

    function showResult(blocked) {
      clearTimeout(statusTimer);

      statusBox.className = blocked ? "blocked" : "posted";
      statusBox.textContent = blocked
        ? "✕ BLOCKIERT"
        : "✓ GEPOSTET";

      statusBox.style.display = "block";

      // Der Status verschwindet, wenn er nicht erneut bestätigt wird.
      statusTimer = setTimeout(() => {
        clearStatus();
      }, 1800);
    }

    // Verbessert Kontrast und Lesbarkeit für die Texterkennung.
    function prepareImage() {
      const width = video.videoWidth;
      const height = video.videoHeight;

      if (!width || !height) {
        return false;
      }

      const maxWidth = 1400;
      const scale = Math.min(1, maxWidth / width);

      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const image = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data = image.data;

      for (let i = 0; i < data.length; i += 4) {
        const gray =
          0.299 * data[i] +
          0.587 * data[i + 1] +
          0.114 * data[i + 2];

        // Erhöht den Kontrast und macht dunkle Schrift deutlicher.
        const contrast = Math.max(
          0,
          Math.min(255, (gray - 128) * 1.5 + 128)
        );

        data[i] = contrast;
        data[i + 1] = contrast;
        data[i + 2] = contrast;
      }

      ctx.putImageData(image, 0, 0);
      return true;
    }

    async function scan() {
      if (!running || scanning || !worker) return;
      if (!prepareImage()) return;

      scanning = true;

      try {
        const first = await worker.recognize(canvas);
        if (!running) return;

        const firstText = (first.data.text || "").trim();
        let secondText = "";

        // Ein zweiter Durchlauf kann bei schwachem Text helfen.
        if (!firstText || first.data.confidence < 65) {
          if (!prepareImage()) return;

          const second = await worker.recognize(canvas);
          if (!running) return;

          secondText = (second.data.text || "").trim();
        }

        const combinedText = [firstText, secondText]
          .filter(Boolean)
          .join(" ");

        // Kein lesbarer Text: keinen der beiden Status anzeigen.
        if (!combinedText.trim()) {
          clearStatus();
          lastResult = null;
          info.textContent = "Kein lesbarer Text erkannt.";
          return;
        }

        info.textContent = "Textprüfung läuft …";

        const blocked =
          containsTarget(firstText) ||
          containsTarget(secondText);

        if (blocked !== lastResult || statusBox.style.display === "none") {
          showResult(blocked);
        }

        lastResult = blocked;

      } catch (error) {
        console.error("Texterkennung fehlgeschlagen:", error);
        clearStatus();
        lastResult = null;
        info.textContent = "Texterkennung momentan nicht möglich.";
      } finally {
        scanning = false;
      }
    }

    async function startCamera() {
      startButton.disabled = true;
      info.textContent = "Kamera und Texterkennung werden gestartet …";
      clearStatus();

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Die Kamera benötigt HTTPS oder localhost."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        if (!worker) {
          worker = await Tesseract.createWorker("deu");
        }

        running = true;
        lastResult = null;

        startButton.disabled = true;
        stopButton.disabled = false;
        info.textContent = "Kamera aktiv. Text wird geprüft …";

        scanTimer = setInterval(scan, 900);
        scan();

      } catch (error) {
        console.error(error);
        stopCamera();

        info.textContent =
          "Start fehlgeschlagen. Erlaube den Kamerazugriff und öffne die Seite über HTTPS.";

        startButton.disabled = false;
      }
    }

    function stopCamera() {
      running = false;
      scanning = false;

      clearInterval(scanTimer);
      clearTimeout(statusTimer);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      clearStatus();
      lastResult = null;

      startButton.disabled = false;
      stopButton.disabled = true;
      info.textContent = "Kamera gestoppt.";
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
